<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tone-sequencer</title>
  <script src="https://unpkg.com/tone@15.0.4/build/Tone.js"></script>
  <script src="sequencer.js" defer></script>
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <dialog id="introDialog">
    <p>This synthesizer will make some noise, please check your system's volume setting.</p>
    <button id="introDialogCloseButton" autofocus>OK</button>
  </dialog>

  <h1>tone sequencer</h1>

  <button id="transport-toggle">⏵</button>

  <fieldset>
    <legend>Sequence 01</legend>
    <div class="seqStepsBox">

      <div class="seqStepBox">
        <input type="checkbox" class="seqStep" id="step01" name="seq01" value="step01" />
        <label for="step01">01</label>
        <span>c3</span>
        <span>+</span>
        <input type="number" class="pitchStep" id="step01pitch" value ="0" aria-label="step01pitch">
      </div>

      <div class="seqStepBox">
        <input type="checkbox" class="seqStep" id="step02" name="seq02" value="step02" />
        <label for="step02">02</label>
        <span>c3</span>
        <span>+</span>
        <input type="number" class="pitchStep" id="step02pitch" value ="0" aria-label="step02pitch">
      </div>

      <div class="seqStepBox">
        <input type="checkbox" class="seqStep" id="step03" name="seq03" value="step03" />
        <label for="step03">03</label>
        <span>c3</span>
        <span>+</span>
        <input type="number" class="pitchStep" id="step03pitch" value ="0" aria-label="step03pitch">
      </div>

      <div class="seqStepBox">
        <input type="checkbox" class="seqStep" id="step04" name="seq04" value="step04" />
        <label for="step04">04</label>
        <span>c3</span>
        <span>+</span>
        <input type="number" class="pitchStep" id="step04pitch" value ="0" aria-label="step04pitch">
      </div>

      <div class="seqStepBox">
        <input type="checkbox" class="seqStep" id="step05" name="seq05" value="step05" />
        <label for="step05">05</label>
        <span>c3</span>
        <span>+</span>
        <input type="number" class="pitchStep" id="step05pitch" value ="0" aria-label="step05pitch">
      </div>

      <div class="seqStepBox">
        <input type="checkbox" class="seqStep" id="step06" name="seq06" value="step06" />
        <label for="step06">06</label>
        <span>c3</span>
        <span>+</span>
        <input type="number" class="pitchStep" id="step06pitch" value ="0" aria-label="step06pitch">
      </div>

      <div class="seqStepBox">
        <input type="checkbox" class="seqStep" id="step07" name="seq07" value="step07" />
        <label for="step07">07</label>
        <span>c3</span>
        <span>+</span>
        <input type="number" class="pitchStep" id="step07pitch" value ="0" aria-label="step07pitch">
      </div>

      <div class="seqStepBox">
        <input type="checkbox" class="seqStep" id="step08" name="seq08" value="step08" />
        <label for="step08">08</label>
        <span>c3</span>
        <span>+</span>
        <input type="number" class="pitchStep" id="step08pitch" value ="0" aria-label="step08pitch">
      </div>

    </div>
  </fieldset>
</body>
</html>
